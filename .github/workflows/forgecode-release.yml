name: ForgeCode Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.1.0-alpha.1)"
        required: true
        default: "0.1.0-alpha.1"
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: true
        type: boolean
      publish:
        description: "Actually create the GitHub release after all platform builds pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: forgecode-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: forgecode-linux-x64
            binary: forgecode
            output: cli-linux-x64
          - runner: macos-15
            asset: forgecode-macos-arm64
            binary: forgecode
            output: cli-darwin-arm64
          - runner: windows-2025
            asset: forgecode-windows-x64.exe
            binary: forgecode.exe
            output: cli-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build ForgeCode executable
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: ${{ inputs.prerelease && 'beta' || 'latest' }}
        run: bun run --cwd packages/cli build:forgecode --single

      - name: Smoke-test ForgeCode executable
        shell: bash
        run: |
          binary="packages/cli/dist/${{ matrix.output }}/bin/${{ matrix.binary }}"
          test -s "$binary"
          "$binary" --version

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp "packages/cli/dist/${{ matrix.output }}/bin/${{ matrix.binary }}" "release-assets/${{ matrix.asset }}"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  publish:
    if: ${{ inputs.publish }}
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate assets and create checksums
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          test -s release-assets/forgecode-linux-x64
          test -s release-assets/forgecode-macos-arm64
          test -s release-assets/forgecode-windows-x64.exe
          chmod +x release-assets/forgecode-linux-x64 release-assets/forgecode-macos-arm64
          (cd release-assets && sha256sum forgecode-* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          tag="v${VERSION}"
          notes="ForgeCode ${tag}: initial release from the community OpenCode fork. Review the README and MIT license notices. Verify SHA256SUMS before running binaries. Assets: Linux x64, macOS arm64, Windows x64."
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ForgeCode ${tag}" --notes "$notes" "${args[@]}"
